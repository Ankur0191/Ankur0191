<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Ankur Mishra — Software Engineer and AI Systems</title>
  <desc id="desc">Dark technical profile banner with a terminal-inspired interface, grid lines, and connected nodes.</desc>
  <defs>
